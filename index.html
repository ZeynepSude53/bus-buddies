<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Buddies 3D: Escape the City</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; }
  #divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; background: #0b0e1a; z-index: 5; }
  .red { color: #ff6a3c; } .blue { color: #46c8ff; } .gold { color: #f7c548; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; top: 0; bottom: 0; width: 50%; pointer-events: none; z-index: 6; overflow: hidden; }
  #hud0 { left: 0; --c: #ff6a3c; }
  #hud1 { left: 50%; --c: #46c8ff; }
  .panel { position: absolute; top: 10px; left: 10px; width: 220px; background: rgba(8,10,22,.8);
    border-radius: 12px; padding: 8px 11px; border: 2px solid var(--c); }
  .pname { font-weight: 800; font-size: 13px; color: var(--c); display: flex; justify-content: space-between; }
  .hearts { font-size: 18px; letter-spacing: 2px; margin-top: 2px; }
  .stam-wrap { margin-top: 5px; height: 9px; background: #222a44; border-radius: 5px; overflow: hidden; }
  .stam { height: 100%; width: 100%; background: linear-gradient(90deg, #f7c548, #37d67a); }
  .stam.tired { background: #c0392b; }
  .stam.boost { background: linear-gradient(90deg, #37d67a, #7df9ff); }
  .status { font-size: 11.5px; margin-top: 5px; min-height: 15px; color: #dfe5ff; }
  .minimap { position: absolute; top: 10px; right: 10px; border: 2px solid var(--c); border-radius: 8px; background: rgba(8,10,22,.8); width: 210px; }
  .bottom { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 10px; align-items: flex-end; }
  .objective { flex: 1; min-width: 0; background: rgba(8,10,22,.85); border-left: 4px solid var(--c); border-radius: 8px;
    padding: 7px 11px; font-size: 13px; line-height: 1.4; }
  .objective b { color: var(--c); }
  .checklist { font-size: 12px; color: #aab3d6; margin-bottom: 3px; letter-spacing: .3px; }
  .checklist .ok { color: #37d67a; }
  .inv { display: flex; gap: 6px; flex: none; }
  .slot { width: 50px; height: 50px; border-radius: 10px; background: rgba(8,10,22,.85); border: 2px solid #3a4266;
    display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
  .slot.sel { border-color: var(--c); box-shadow: 0 0 10px var(--c); }
  .slot.weapon { border-color: #f7c548; margin-right: 4px; }
  .slot .n { position: absolute; bottom: 1px; right: 4px; font-size: 10px; color: #8d96bd; }
  .slot .dur { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  .slot .dur i { display: block; height: 100%; background: #f7c548; }
  .hud.narrow .bottom { flex-direction: column-reverse; align-items: stretch; }
  .hud.narrow .inv { align-self: flex-end; }
  .hud.narrow .objective { font-size: 12px; }
  .hud.narrow .panel { width: 190px; }

  .toast { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); background: rgba(8,10,22,.9);
    border: 2px solid var(--c); border-radius: 10px; padding: 8px 16px; font-size: 15px; font-weight: 600;
    opacity: 0; transition: opacity .2s; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .danger, .flash { position: absolute; inset: 0; pointer-events: none; }
  .revive { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); width: 220px; text-align: center;
    font-size: 14px; font-weight: 700; display: none; text-shadow: 0 2px 4px #000; }
  .revive .bar { margin-top: 6px; height: 10px; background: #222a44; border-radius: 5px; overflow: hidden; }
  .revive .bar i { display: block; height: 100%; width: 0; background: #37d67a; }

  #timer { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 7; background: rgba(8,10,22,.92);
    border: 2px solid #f7c548; border-radius: 12px; padding: 4px 14px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #timer.low { border-color: #ff3b3b; color: #ff6b6b; }

  /* ---------- Ekranlar ---------- */
  .screen { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, rgba(40,20,50,.88), rgba(4,5,12,.97)); overflow: auto; padding: 20px; }
  .card { max-width: 760px; width: 100%; background: linear-gradient(180deg, #19183a, #111027); border: 2px solid #3a2d5c; border-radius: 20px;
    padding: 28px 32px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .title { font-size: clamp(32px, 6vw, 54px); font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
  .title .f { color: #ff6a3c; text-shadow: 0 0 24px rgba(255,106,60,.6); }
  .title .w { color: #46c8ff; text-shadow: 0 0 24px rgba(70,200,255,.6); }
  .sub { color: #aab3d6; margin: 8px 0 18px; font-size: 16px; }
  .hero { font-size: 64px; margin: 6px 0 4px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  button.big { font-size: 18px; font-weight: 800; padding: 12px 28px; border-radius: 12px; border: none;
    background: #f7c548; color: #141428; cursor: pointer; }
  button.big.ghost { background: transparent; color: #dfe5ff; border: 2px solid #3a4266; }
  button.big:hover { filter: brightness(1.1); }
  button.big:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .hint { font-size: 12px; color: #8a86ad; margin-top: 12px; }
  .hidden { display: none !important; }
  .tut-art { font-size: 58px; height: 76px; line-height: 76px; }
  .tut-title { font-size: 28px; font-weight: 900; margin: 6px 0 10px; }
  .tut-body { text-align: left; font-size: 15.5px; line-height: 1.6; color: #dfe5ff; min-height: 190px; }
  .tut-body ul, .tut-body ol { margin-left: 22px; }
  .tut-body li { margin: 4px 0; }
  .tut-body table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tut-body th, .tut-body td { padding: 5px 8px; border-bottom: 1px solid #2d2a50; text-align: left; }
  .tut-body th { color: #aab3d6; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3a4266; }
  .dots i.on { background: #f7c548; }
  .tut-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; }
  .tut-nav button { font-size: 15px; padding: 10px 18px; }
  .stars { font-size: 44px; letter-spacing: 6px; margin: 6px 0; }
  .stats { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .stats div { background: #0d0c20; border: 1px solid #2d2a50; border-radius: 12px; padding: 10px 16px; min-width: 120px; }
  .stats b { display: block; font-size: 24px; }
  .stats span { font-size: 12px; color: #aab3d6; }
</style>
<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="divider"></div>
<div id="timer">9:00</div>

<!-- Ana menü -->
<div id="menuScreen" class="screen">
  <div class="card">
    <div class="hero">🔥🚌💧</div>
    <div class="title">Bus Buddies <span class="f">Ateş</span> &amp; <span class="w">Su</span></div>
    <div class="sub">Escape the City · 2 kişilik, aynı klavyede co-op platform kaçış oyunu</div>
    <div class="btns">

<!-- Eğitim sayfaları -->
<div id="tutScreen" class="screen hidden">
  <div class="card">

</div>

<!-- Duraklatma -->
<div id="pauseScreen" class="screen hidden">
  <div class="card">
    <div class="title">⏸ Duraklatıldı</div>

      <button class="big" id="resumeBtn">▶ Devam et</button>

</div>

<!-- Bitiş -->
<div id="endScreen" class="screen hidden">
  <div class="card">
    <div class="hero" id="endHero">🚌</div>
    <div class="title" id="endTitle">Kaçtınız!</div>
    <div class="stars" id="endStars"></div>
    <div class="sub" id="endText"></div>
    <div class="stats" id="endStats"></div>
    <div class="btns">
      <button class="big" id="nextBtn">▶ SONRAKİ LEVEL</button>
      <button class="big" id="restartBtn">↺ TEKRAR OYNA</button>
      <button class="big ghost" id="menuBtn">Ana menü</button>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   AYARLAR
   Dünya: 4000 x 2800 birimlik planar (Kartezyen) koordinat sistemi.
   Yatay mantık (x, z) düzleminde; y = yükseklik (platformlar, zıplama).
   ===================================================================== */
const WORLD_W = 4000, WORLD_H = 2800;
const GAME_TIME = 540;
const ROAD_W = 120, SIDEWALK = 25;
let V_ROADS = [400, 1300, 2000, 2700, 3600];
let H_ROADS = [400, 1400, 2400];
let CENTER = { x: 2000, z: 1400 };

const WALK = 150, SPRINT = 240, EXHAUSTED_SPEED = 100, ADRENALINE = 1.3;
const STAMINA_DRAIN = 24, REGEN_WALK = 14, REGEN_IDLE = 26, EXHAUST_TIME = 2.5, TIRED_UNTIL = 30;
const JUMP_V = 330, GRAVITY = 950, STEP = 10, COYOTE = 0.1, JUMP_BUFFER = 0.13, BODY_H = 50;
const PLAYER_R = 14, MONSTER_R = 18;
const DETECT_R = 240, LOSE_R = 380, HIT_R = 32, MAX_CHASE = 7;
const CHASE_SPEED = 118, PATROL_SPEED = 60, LUNGE_SPEED = 340, LUNGE_RANGE = 85, MONSTER_HP = 3;
const INTERACT_R = 75, PICKUP_R = 38, SMOKE_R = 250, REVIVE_R = 70, REVIVE_TIME = 2;
let SPAWNS = [{ x: 1255, z: 1400 }, { x: 1345, z: 1400 }];

const ITEM_TYPES = {
  energy: { icon: '🥤', name: 'Enerji İçeceği', color: 0x37d67a, w: 0.22 },
  smoke:  { icon: '💨', name: 'Sis Bombası',   color: 0xb8c2d0, w: 0.15 },
  shield: { icon: '🛡️', name: 'Kalkan',        color: 0x4aa8ff, w: 0.14 },
  medkit: { icon: '❤️', name: 'İlk Yardım',    color: 0xff4d6d, w: 0.17 },
  bat:    { icon: '🏏', name: 'Sopa',          color: 0xc8924a, w: 0.18, weapon: true },
  knife:  { icon: '🔪', name: 'Bıçak',         color: 0xdddddd, w: 0.14, weapon: true },
};
const WEAPONS = {
  fist:  { dmg: 0, range: 50, arc: 1.6, knock: 70,  stun: 0.9, cd: 0.7 },
  bat:   { dmg: 1, range: 78, arc: 2.0, knock: 140, stun: 2.2, cd: 0.55, dur: 6 },
  knife: { dmg: 2, range: 56, arc: 1.3, knock: 45,  stun: 1.2, cd: 0.35, dur: 5 },
};
const CONTROLS = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], interact: ['KeyE'], sprint: ['ShiftLeft'],
    jump: ['Space'], attack: ['KeyF'], use: ['KeyQ'], cycle: ['KeyR'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], interact: ['Enter', 'NumpadEnter'],
    sprint: ['ShiftRight'], jump: ['Slash', 'Numpad0'], attack: ['Period', 'Numpad1'], use: ['Comma', 'Numpad2'], cycle: ['Semicolon', 'Numpad3'] },
];
const NAMES = ['Ateş', 'Su'];
const ELEMENT = ['fire', 'water'];
const PCOL = [0xff6a3c, 0x46c8ff], PCSS = ['#ff6a3c', '#46c8ff'];

/* ---------- Yardımcılar ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let srand = mulberry32(458);
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inRect = (p, r, m = 0) => p.x > r.x0 - m && p.x < r.x1 + m && p.z > r.z0 - m && p.z < r.z1 + m;
function wrapA(d) { while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }
const lerpAngle = (a, b, k) => a + wrapA(b - a) * k;
const angDiff = (a, b) => Math.abs(wrapA(b - a));
const fmtTime = s => { const t = Math.max(0, Math.ceil(s)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

/* =====================================================================
   SES (WebAudio sentezi)
   ===================================================================== */
let AC = null, ambientOn = false;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function tone({ f = 200, f2 = null, type = 'sine', dur = 0.2, vol = 0.15, delay = 0 }) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise({ dur = 0.3, vol = 0.15, freq = 800, type = 'lowpass', delay = 0 }) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay, buf = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
function startAmbient() {
  const c = ac(); if (!c || ambientOn) return; ambientOn = true;
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.value = 41; f.type = 'lowpass'; f.frequency.value = 120; g.gain.value = 0.035;
  const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.02;
  lfo.connect(lg).connect(g.gain); o.connect(f).connect(g).connect(c.destination); o.start(); lfo.start();
}
const sfx = {
  roar() { tone({ f: 150, f2: 45, type: 'sawtooth', dur: 1.1, vol: 0.16 }); tone({ f: 95, f2: 38, type: 'square', dur: 1.0, vol: 0.07 }); noise({ dur: 0.9, vol: 0.16, freq: 500 }); },
  hurt() { tone({ f: 220, f2: 70, type: 'square', dur: 0.3, vol: 0.12 }); noise({ dur: 0.2, vol: 0.12, freq: 1200 }); },
  swing() { noise({ dur: 0.14, vol: 0.12, freq: 2500, type: 'highpass' }); },
  whack() { tone({ f: 120, f2: 40, type: 'triangle', dur: 0.18, vol: 0.25 }); noise({ dur: 0.1, vol: 0.15, freq: 900 }); },
  die() { tone({ f: 300, f2: 30, type: 'sawtooth', dur: 0.8, vol: 0.12 }); },
  pick() { tone({ f: 880, f2: 1320, dur: 0.12, vol: 0.1 }); },
  gem() { [1047, 1319, 1568].forEach((f, i) => tone({ f, dur: 0.14, vol: 0.08, delay: i * 0.06, type: 'triangle' })); },
  task() { [523, 659, 784, 1047].forEach((f, i) => tone({ f, dur: 0.2, vol: 0.12, delay: i * 0.11 })); },
  jump() { tone({ f: 260, f2: 520, dur: 0.1, vol: 0.05 }); },
  land() { noise({ dur: 0.06, vol: 0.06, freq: 400 }); },
  splash() { noise({ dur: 0.5, vol: 0.2, freq: 1500 }); tone({ f: 600, f2: 120, dur: 0.4, vol: 0.08 }); },
  sizzle() { noise({ dur: 0.6, vol: 0.2, freq: 3000, type: 'highpass' }); tone({ f: 200, f2: 60, type: 'sawtooth', dur: 0.4, vol: 0.06 }); },
  click() { tone({ f: 420, dur: 0.06, vol: 0.08, type: 'square' }); },
  hiss() { noise({ dur: 0.8, vol: 0.2, freq: 2600, type: 'highpass' }); tone({ f: 110, f2: 45, type: 'sawtooth', dur: 0.9, vol: 0.12 }); noise({ dur: 0.5, vol: 0.12, freq: 300, delay: 0.25 }); },
  heart() { tone({ f: 62, dur: 0.12, vol: 0.32 }); tone({ f: 55, dur: 0.12, vol: 0.26, delay: 0.17 }); },
};

/* =====================================================================
   GİRDİ
   ===================================================================== */
const keys = new Set(), pressed = new Set();
const PREVENT = new Set(CONTROLS.flatMap(c => Object.values(c).flat()).concat(['Tab']));
addEventListener('keydown', e => {
  if (PREVENT.has(e.code) && state !== 'menu') e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (state === 'playing') pauseGame(); });
const isDown = codes => codes.some(c => keys.has(c));
const wasPressed = codes => codes.some(c => pressed.has(c));

/* =====================================================================
   SAHNE
   ===================================================================== */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const SKY = 0x171b33;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 800, 2200);
const hemi = new THREE.HemisphereLight(0x95a3dd, 0x2a2622, 0.85); scene.add(hemi);
scene.add(new THREE.AmbientLight(0x404060, 0.4));
const levelRoot = new THREE.Group(); scene.add(levelRoot); // level'a ait her şey burada
const moon = new THREE.DirectionalLight(0xc0ccff, 1.1);
moon.position.set(CENTER.x - 1100, 1900, CENTER.z + 900);
moon.target.position.set(CENTER.x, 0, CENTER.z);
moon.castShadow = true;
moon.shadow.mapSize.set(4096, 4096);
Object.assign(moon.shadow.camera, { left: -2700, right: 2700, top: 2300, bottom: -2300, near: 100, far: 5200 });
moon.shadow.bias = -0.0006;
scene.add(moon, moon.target);

const cameras = [0, 1].map(() => new THREE.PerspectiveCamera(50, 1, 5, 6000));
const camLook = [new THREE.Vector3(), new THREE.Vector3()];
const shake = [0, 0];

/* =====================================================================
   KATI CİSİMLER (yükseklikli kutular) + uzamsal ızgara indeksi
   Her kutu: x0,z0,x1,z1 (taban dikdörtgeni) + y0,y1 (alt/üst yükseklik)
   ===================================================================== */
const solids = [], dynSolids = [], fadeables = [];
const CELL = 200, grid = new Map();
function box(x0, z0, x1, z1, y1, o = {}) {
  const s = { x0, z0, x1, z1, y0: o.y0 ?? 0, y1, kind: o.kind || 'box', active: true };
  if (o.color !== undefined || o.mat) {
    const mat = o.mat || new THREE.MeshLambertMaterial({ color: o.color, ...(o.matOpts || {}) });
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - s.y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (s.y0 + y1) / 2, (z0 + z1) / 2);
    m.castShadow = o.cast ?? true; m.receiveShadow = true; levelRoot.add(m); s.mesh = m;
    if (o.fade) fadeables.push({ b: s, mats: Array.isArray(mat) ? [...new Set(mat)] : [mat], faded: false });
  }
  (o.dyn ? dynSolids : solids).push(s);
  return s;
}
function buildGrid() {
  grid.clear();
  for (const s of solids) for (let cx = Math.floor(s.x0 / CELL); cx <= Math.floor(s.x1 / CELL); cx++)
    for (let cz = Math.floor(s.z0 / CELL); cz <= Math.floor(s.z1 / CELL); cz++) {
      const k = cx * 4096 + cz; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(s);
    }
}
function query(x, z, r) {

  /* ---------- Yol üstü: arabalar, kasalar, barikatlar (hepsinin üstüne çıkılabilir) ---------- */
  const FULL_BARRICADES = [{ road: 'v', at: 1300, s: 900 }, { road: 'h', at: 400, s: 2350 }, { road: 'v', at: 2700, s: 1900 }, { road: 'h', at: 2400, s: 1650 }, { road: 'v', at: 3600, s: 900 }];

    const okSpot = (x, z) => avoid.every(a => dist(a, { x, z }) > 170) && dist(CENTER, { x, z }) > 230;
    const segs = [];
    for (const x of V_ROADS) { const zs = [0, ...H_ROADS, WORLD_H]; for (let i = 0; i < zs.length - 1; i++) segs.push({ road: 'v', at: x, a: zs[i] + (i ? ROAD_W / 2 : 0) + 30, b: zs[i + 1] - (i < zs.length - 2 ? ROAD_W / 2 : 0) - 30 }); }
    for (const z of H_ROADS) { if (z === CENTER.z) continue; const xs = [0, ...V_ROADS, WORLD_W]; for (let i = 0; i < xs.length - 1; i++) segs.push({ road: 'h', at: z, a: xs[i] + (i ? ROAD_W / 2 : 0) + 30, b: xs[i + 1] - (i < xs.length - 2 ? ROAD_W / 2 : 0) - 30 }); }

      const g = new THREE.Group(), bodyM = burnt ? burntM : new THREE.MeshLambertMaterial({ color: [0x8a2f2f, 0x2f5a8a, 0x777777, 0xd0c8b0, 0x2f6b3d][Math.floor(srand() * 5)] });

    for (const sg of segs) {
      const L = sg.b - sg.a; if (L < 120) continue;
      const n = Math.floor(L / 210);
      for (let k = 0; k < n; k++) {
        const s = sg.a + (k + 0.5) * L / n + (srand() - 0.5) * 50, side = srand() < 0.5 ? -1 : 1, roll = srand();
        const x = sg.road === 'v' ? sg.at + side * 34 : s, z = sg.road === 'v' ? s : sg.at + side * 34;
        if (!okSpot(x, z) || FULL_BARRICADES.some(f => f.road === sg.road && f.at === sg.at && Math.abs(f.s - s) < 130)) continue;
        if (roll < 0.36) car(sg.road, sg.at, s, side, srand() < 0.3);
        else if (roll < 0.66) { // kasa basamakları: 24 ve 48 yükseklik
          const [x0, z0, x1, z1] = R(sg.road, sg.at, s, side * 30, 30, 56);
          box(x0, z0, x1, z1, 24, { mat: crateM });
          if (srand() < 0.5) { const [a0, b0, a1, b1] = R(sg.road, sg.at, s + 30, side * 38, 28, 30); box(a0, b0, a1, b1, 48, { mat: crateM }); }
        } else if (roll < 0.84) { const [x0, z0, x1, z1] = R(sg.road, sg.at, s, side * 30, 14, 60); box(x0, z0, x1, z1, 24, { mat: barM }); }
        else {
          const cM = new THREE.MeshLambertMaterial({ color: 0xff7a1a });
          for (let i = 0; i < 3; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry(5, 16, 8), cM); c.position.set(x + (i - 1) * 14, 8, z + (i % 2) * 8); levelRoot.add(c); }

function makeCharacter(id) {
  const fire = id === 0, main = PCOL[id], dark = fire ? 0x6a1a0a : 0x0d3a6a, glow = fire ? 0xffc040 : 0xa8ecff;
  const g = new THREE.Group(); g.rotation.order = 'YXZ';
  const M = (c, e = 0) => new THREE.MeshLambertMaterial({ color: c, emissive: e ? c : 0, emissiveIntensity: e });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(9, 12, 4, 10), M(dark)); body.position.y = 30;
  const belly = new THREE.Mesh(new THREE.SphereGeometry(6, 10, 8), M(main, 0.5)); belly.position.set(0, 31, 6); belly.scale.set(1, 1.2, 0.5);
  const head = new THREE.Mesh(new THREE.SphereGeometry(11, 16, 12), M(main, 0.55)); head.position.y = 52;
  const hair = new THREE.Group(); hair.position.y = 52;
  if (fire) {
    [[0, 16, -2, 9, 22], [-6, 12, -4, 6, 16], [6, 12, -4, 6, 16], [0, 10, -9, 7, 18]].forEach(([x, y, z, r, h], i) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), new THREE.MeshBasicMaterial({ color: i % 2 ? glow : 0xff7a20 }));
      c.position.set(x, y, z); c.rotation.x = -0.35; hair.add(c);
    });
  } else {
    const drop = new THREE.Mesh(new THREE.ConeGeometry(8, 22, 12), new THREE.MeshBasicMaterial({ color: glow })); drop.position.set(0, 16, -3); drop.rotation.x = -0.3; hair.add(drop);
    const back = new THREE.Mesh(new THREE.SphereGeometry(10, 12, 10), new THREE.MeshBasicMaterial({ color: 0x5fd0ff })); back.position.set(0, 2, -5); back.scale.set(1.05, 1.1, 0.8); hair.add(back);
  }
  const eyeW = new THREE.MeshBasicMaterial({ color: 0xffffff }), eyeB = new THREE.MeshBasicMaterial({ color: 0x111111 });
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(3.2, 10, 8), eyeW); w.position.set(s * 4.2, 53, 9.4); w.scale.set(1, 1.25, 0.6);
    const b = new THREE.Mesh(new THREE.SphereGeometry(1.7, 8, 6), eyeB); b.position.set(s * 4.2, 53, 11.2); g.add(w, b);
  }
  const limb = (w, h, color, x, y) => {
    const pivot = new THREE.Group(); pivot.position.set(x, y, 0);
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(w / 2, h - w, 3, 6), M(color)); m.position.y = -h / 2; m.castShadow = true;
    pivot.add(m); g.add(pivot); return pivot;
  };
  const armL = limb(6, 20, dark, -12, 40), armR = limb(6, 20, dark, 12, 40);
  const legL = limb(7, 20, dark, -5, 20), legR = limb(7, 20, dark, 5, 20);
  const bat = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 3.6, 36, 8), M(0xb07a3a)); bat.position.set(0, -22, 14); bat.rotation.x = Math.PI / 2;
  const knife = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 18), M(0xdddddd)); knife.position.set(0, -21, 10);
  armR.add(bat, knife); bat.visible = knife.visible = false;
  [body, head].forEach(m => (m.castShadow = true));
  g.add(body, belly, head, hair);
  const ring = new THREE.Mesh(new THREE.RingGeometry(17, 23, 28), new THREE.MeshBasicMaterial({ color: main, transparent: true, opacity: 0.9, depthTest: false, fog: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 1.5; ring.renderOrder = 999;
  const marker = markerSprite(PCSS[id], id === 0 ? 'P1' : 'P2'); marker.position.y = 100;
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(36, 20, 14), new THREE.MeshBasicMaterial({ color: 0x6fc3ff, transparent: true, opacity: 0.22, depthWrite: false })); bubble.position.y = 32; bubble.visible = false;
  // Hedef oku (waypoint)
  const arrowPivot = new THREE.Group();
  const arrow = new THREE.Mesh(new THREE.ConeGeometry(8, 22, 3), new THREE.MeshBasicMaterial({ color: 0xf7c548, depthTest: false, transparent: true, opacity: 0.95, fog: false }));
  arrow.rotation.x = Math.PI / 2; arrow.position.set(0, 3, 44); arrow.renderOrder = 1002; arrowPivot.add(arrow);
  const root = new THREE.Group(); root.add(g, ring, marker, bubble, arrowPivot);
  return { root, g, armL, armR, legL, legR, bat, knife, ring, marker, bubble, arrowPivot, hair };
}
function makeMonster() {
  const g = new THREE.Group(); g.rotation.order = 'YXZ';
  const skin = new THREE.MeshLambertMaterial({ color: 0x3a2350, flatShading: true, emissive: 0x12001a });
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(22, 1), skin); body.position.y = 40; body.scale.set(1, 1.25, 0.85); body.castShadow = true;
  const eyeM = new THREE.MeshBasicMaterial({ color: 0xff2020, fog: false });
  const e1 = new THREE.Mesh(new THREE.SphereGeometry(3.6, 8, 6), eyeM), e2 = e1.clone(), e3 = e1.clone();
  e1.position.set(-8, 52, 17); e2.position.set(8, 52, 17); e3.position.set(0, 58, 16); e3.scale.setScalar(0.7);
  const hornM = new THREE.MeshLambertMaterial({ color: 0xd8d0c0 });
  const h1 = new THREE.Mesh(new THREE.ConeGeometry(4, 20, 6), hornM), h2 = h1.clone();
  h1.position.set(-11, 70, 0); h1.rotation.z = 0.5; h2.position.set(11, 70, 0); h2.rotation.z = -0.5;
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(18, 7, 2), new THREE.MeshBasicMaterial({ color: 0x400010 })); mouth.position.set(0, 38, 19);
  const teethM = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (let i = -3; i <= 3; i++) { const t = new THREE.Mesh(new THREE.ConeGeometry(1.4, 4, 4), teethM); t.position.set(i * 2.6, 40.5, 19.5); t.rotation.x = Math.PI; g.add(t); }
  const limb = (x, y, z, rx, len) => { const p = new THREE.Group(); p.position.set(x, y, z);
    const m = new THREE.Mesh(new THREE.BoxGeometry(7, len, 7), skin); m.position.y = -len / 2; m.castShadow = true; p.add(m);
    const claw = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 4), hornM); claw.position.y = -len - 3; claw.rotation.x = Math.PI; p.add(claw);
    p.rotation.x = rx; g.add(p); return p; };
  const armL = limb(-25, 50, 4, -1.1, 32), armR = limb(25, 50, 4, -1.1, 32);
  const legL = limb(-9, 20, 0, 0, 20), legR = limb(9, 20, 0, 0, 20);
  g.add(body, e1, e2, e3, h1, h2, mouth);
  return { g, armL, armR, legL, legR, eyeM, body };
}
function animateLimbs(m, phase, amp) {
  const s = Math.sin(phase) * amp;
  m.legL.rotation.x = s; m.legR.rotation.x = -s; m.armL.rotation.x = -s * 0.8; m.armR.rotation.x = s * 0.8;
}

const nodes = [], nodeIdx = new Map();

const edgeBlocked = (a, b) => (a.x === CENTER.x && a.z === CENTER.z) || (b.x === CENTER.x && b.z === CENTER.z) || fullBarricades.some(o => segHitsRect(a, b, o));

}

    if (blockedAt(pt.x, pt.z, pt) || supportAt(pt.x, pt.z, pt.r, 0)[0] > 0) continue;
    if (pools.some(pl => pl.active && pl.y === 0 && inRect(pt, pl, 20) && !(LV.monster.swim && pl.type === 'water'))) continue;
    if (players.some(p => !p.onBus && dist(p, pt) < 230)) continue;

}

function spawnItem(type, near) {

    if (t.who !== p.element) { toast(p.id, t.wrongMsg, 1.8); return; }
    t.done = true;
    LV.onTask(key);
    director.next = Math.min(director.next, 12);
    return;
  }
}
function onTaskL1(key) {
  {
    if (key === 'ticket') { mech.bridge.locked = true; taskDone('🎫 Bilet alındı! Köprü sabitlendi. Sıradaki durak: 🏗️ Şantiye'); }
    else { coolPool(mech.lava);
      addPuff((mech.lava.x0 + mech.lava.x1) / 2, 0, (mech.lava.z0 + mech.lava.z1) / 2, 0x888888, 3, 200, 18);
      taskDone(TASKS.ticket.done ? '⚡ Güç geldi, lav soğudu! Şimdi 🏭 Fabrika ve 🌿 Çatı Bahçesi butonları' : '⚡ Güç geldi, lav soğudu! Bileti de unutmayın 🎫'); }
  }
}
function useItem(p) {
  const it = p.inventory[p.sel];
  if (!it) { toast(p.id, 'Seçili slot boş', 1.2); return; }
  if (it === 'energy') { p.stamina = 100; p.tired = false; p.exhausted = 0; p.boost = 6; toast(p.id, '🥤 Enerji doldu! 6 sn sınırsız koşu'); }
  else if (it === 'smoke') { throwSmoke(p.x, p.z); toast(p.id, '💨 Sis bombası!'); }
  else if (it === 'shield') { if (p.shield) { toast(p.id, 'Kalkan zaten aktif', 1.4); return; } p.shield = true; toast(p.id, '🛡️ Kalkan aktif!'); }
  else if (it === 'medkit') { if (p.lives >= 3) { toast(p.id, 'Canın zaten dolu', 1.4); return; } p.lives++; toast(p.id, '❤️ +1 can'); }
  sfx.pick();
  p.inventory[p.sel] = null;
  const next = p.inventory.findIndex(x => x); if (next >= 0) p.sel = next;
}
function attack(p) {
  if (p.atkCd > 0) return;
  const w = WEAPONS[p.weapon || 'fist'];
  p.atkCd = w.cd; p.swing = 0.25; sfx.swing();
  let hitAny = false;
  for (const m of [...monsters]) {
    if (m.state === 'dying' || m.state === 'emerge' || p.y > 40) continue;
    const d = dist(p, m); if (d > w.range + m.r) continue;
    const ang = Math.atan2(m.x - p.x, m.z - p.z);
    if (d > 25 && angDiff(p.facing, ang) > w.arc / 2) continue;
    hitAny = true; m.hp -= w.dmg;
    const kx = (m.x - p.x) / (d || 1), kz = (m.z - p.z) / (d || 1);
    for (let s = 0; s < 8; s++) moveWithCollision(m, kx * w.knock / 8, kz * w.knock / 8);
    if (m.hp <= 0) { m.state = 'dying'; m.t = 0.8; p.kills++; sfx.die(); addPuff(m.x, 0, m.z, 0x5a2a7a, 1.2); toast(p.id, '💥 Canavarı yendin!', 1.6); }
    else { m.state = 'stunned'; m.t = w.stun; m.target = null; }
  }
  if (hitAny) { sfx.whack(); shake[p.id] = 5; if (p.weapon && --p.weaponDur <= 0) { toast(p.id, `${ITEM_TYPES[p.weapon].icon} kırıldı!`, 1.6); p.weapon = null; } }
}

   GÜNCELLEME

function respawnAtSafe(p, why) {
  addPuff(p.x, p.y, p.z, why === 'water' ? 0x9fd8ff : 0x555555, 1, 20, 6);
  why === 'water' ? sfx.splash() : sfx.sizzle();
  Object.assign(p, { x: p.safe.x, z: p.safe.z, y: p.safe.y, vy: 0, invuln: Math.max(p.invuln, 1.2), falls: p.falls + 1 });
  unstick(p);
  toast(p.id, why === 'water' ? '💦 Ateş suya düştü! Son güvenli noktaya döndün' : '🔥 Su lava düştü! Son güvenli noktaya döndün', 2);
}

// Kurtarma: birkaç saniye önceki güvenli noktaya ya da en yakın yol düğümüne ışınla
function rescuePlayer(p) {
  let spot = null;
  for (let i = p.safeHist.length - 1; i >= 0; i--) { const s = p.safeHist[i]; if (dist(s, p) > 80) { spot = s; break; } }
  if (!spot) { const n = nodes[nearestNode(p)]; spot = { x: n.x, z: n.z, y: 0 }; }
  addPuff(p.x, p.y, p.z, 0xaaaaff, 0.8, 16, 5);
  Object.assign(p, { x: spot.x, z: spot.z, y: spot.y, vy: 0, onGround: false, invuln: Math.max(p.invuln, 1.5) });
  unstick(p);
  p.stuckWin = null;
  toast(p.id, '✨ Sıkıştın, güvenli bir noktaya alındın', 2);
}

function updatePlayer(p, dt) {
  const c = CONTROLS[p.id], other = players[1 - p.id];
  if (p.onBus) {
    p.x = bus.x; p.z = bus.z;
    if (other.down && bus.state === 'ready' && wasPressed(c.interact)) { p.onBus = false; p.x = bus.x; p.z = bus.z + 70; p.y = 0; p.mesh.root.visible = true; toast(p.id, 'Otobüsten indin, partnerini kaldır!'); }
    return;
  }
  p.invuln = Math.max(0, p.invuln - dt);
  if (!unstick(p)) { rescuePlayer(p); return; }
  if (p.down) return;

  if (other.down && !other.onBus && dist(p, other) < REVIVE_R && isDown(c.interact)) {
    other.reviveT += dt;
    if (other.reviveT >= REVIVE_TIME) {
      Object.assign(other, { down: false, lives: 1, reviveT: 0, invuln: 3, stamina: 60, tired: false, exhausted: 0 });
      other.mesh.g.rotation.x = 0; sfx.task(); toast('both', '🤝 Ayağa kalktı!');
    }
  } else if (other.down) other.reviveT = Math.max(0, other.reviveT - dt * 2);

  let dx = (isDown(c.right) ? 1 : 0) - (isDown(c.left) ? 1 : 0);
  let dz = (isDown(c.down) ? 1 : 0) - (isDown(c.up) ? 1 : 0);
  const moving = dx !== 0 || dz !== 0;
  if (moving) { const l = Math.hypot(dx, dz); dx /= l; dz /= l; }
  // Sıkışma bekçisi: 2 sn boyunca en az 3 farklı yöne basıp yerinden kıpırdayamazsa kurtar
  if (moving) {
    const w = p.stuckWin ??= { t: 0, x: p.x, z: p.z, y: p.y, dirs: 0 };
    w.t += dt; w.dirs |= (dx > 0 ? 1 : 0) | (dx < 0 ? 2 : 0) | (dz > 0 ? 4 : 0) | (dz < 0 ? 8 : 0);
    if (w.t > 2) {
      const bits = [1, 2, 4, 8].filter(b => w.dirs & b).length;
      if (bits >= 3 && Math.hypot(p.x - w.x, p.z - w.z) < 12 && Math.abs(p.y - w.y) < 12) { rescuePlayer(p); return; }
      p.stuckWin = null;
    }
  } else p.stuckWin = null;
  for (const k of ['exhausted', 'boost', 'adrenaline', 'atkCd', 'swing', 'warnT', 'fullWarn']) p[k] = Math.max(0, p[k] - dt);

  // --- Stamina ---
  let speed = WALK;
  p.sprinting = moving && isDown(c.sprint) && !p.tired;
  if (p.sprinting) {
    speed = SPRINT;
    if (p.boost <= 0 && p.adrenaline <= 0) {
      p.stamina -= STAMINA_DRAIN * dt;
      if (p.stamina <= 0) { p.stamina = 0; p.tired = true; p.exhausted = EXHAUST_TIME; p.sprinting = false; toast(p.id, '😵 Bitkin düştün! Biraz yavaşla...'); }
    }
  } else if (p.onGround) p.stamina = Math.min(100, p.stamina + (moving ? REGEN_WALK : REGEN_IDLE) * dt);
  if (p.tired && p.stamina >= TIRED_UNTIL) p.tired = false;
  if (p.exhausted > 0) speed = EXHAUSTED_SPEED;
  if (p.adrenaline > 0) speed *= ADRENALINE;

  // Hareketli platform taşıması
  if (p.onGround && p.support && p.support.kind === 'slider') moveWithCollision(p, mech.slider.dx, 0);
  // --- Yatay hareket ---
  if (moving) {
    moveWithCollision(p, dx * speed * dt, dz * speed * dt);
    p.facing = Math.atan2(dx, dz);
    p.phase += dt * speed * 0.07;
  } else p.phase *= 0.85;

  // --- Dikey: zıplama, yerçekimi, platformlar ---
  if (wasPressed(c.jump)) p.jumpBuf = JUMP_BUFFER; else p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  const [ground, src] = supportAt(p.x, p.z, p.r, p.y);
  if (p.onGround) p.coyote = COYOTE; else p.coyote = Math.max(0, p.coyote - dt);
  if (p.jumpBuf > 0 && p.coyote > 0) { p.vy = JUMP_V; p.jumpBuf = 0; p.coyote = 0; p.onGround = false; sfx.jump(); }
  if (p.onGround && p.vy <= 0 && p.y - ground < 6) { p.y = ground; p.vy = 0; p.support = src; }
  else {
    const prevVy = p.vy;
    p.vy -= GRAVITY * dt;
    // kafa çarpması (köprü altları vb.)
    if (p.vy > 0) for (const s of query(p.x, p.z, p.r)) if (s.active && s.y0 > p.y + 10 && s.y0 < p.y + BODY_H + p.vy * dt && circleRect(p.x, p.z, p.r * 0.7, s)) { p.vy = 0; break; }
    p.y += p.vy * dt;
    if (p.y <= ground) {
      p.y = ground; p.vy = 0; p.support = src;
      if (!p.onGround && prevVy < -300) { p.squash = 0.18; sfx.land(); if (prevVy < -500) addPuff(p.x, ground, p.z, 0x9a9a9a, 0.5, 14, 4); }
      p.onGround = true;
    } else { p.onGround = false; p.support = null; }
  }
  if (p.y < ground) p.y = ground; // yükselen asansör
  p.squash = Math.max(0, p.squash - dt);

  // --- Havuzlar: ters elemente düşmek = son güvenli noktaya dönüş ---
  if (p.onGround) {
    const pl = pools.find(q => q.active && Math.abs(p.y - q.y) < 3 && inRect(p, q, -4));
    if (pl && pl.type !== p.element) { respawnAtSafe(p, pl.type); return; }
    p.safeT -= dt;
    const dynSup = p.support && (p.support.kind === 'slider' || p.support.kind === 'lift' || p.support.kind === 'bridge');
    if (!pl && !dynSup && p.safeT <= 0 && !blockedAt(p.x, p.z, p)) { p.safe = { x: p.x, z: p.z, y: p.y }; p.safeT = 0.35; p.safeHist.push(p.safe); if (p.safeHist.length > 40) p.safeHist.shift(); }
  }

  // Bölgeye ilk giriş
  const di = districtInfo.findIndex(d => inRect(p, d));
  if (di >= 0 && !districtInfo[di].entered[p.id]) { districtInfo[di].entered[p.id] = true; toast(p.id, `${districtInfo[di].name}`, 1.8); }

  if (wasPressed(c.interact)) interact(p);
  if (wasPressed(c.use)) useItem(p);
  if (wasPressed(c.cycle)) { p.sel = (p.sel + 1) % 3; sfx.click(); }
  if (wasPressed(c.attack)) attack(p);

  // Elmaslar
  for (const g of gems) {
    if (g.taken || g.who !== p.element) continue;
    if (dist(p, g) < 28 && Math.abs(p.y - g.y) < 34) { g.taken = true; g.mesh.visible = false; p.gems++; sfx.gem(); toast(p.id, `💎 ${p.gems}/${gemTotals[p.id]}`, 1); }
  }
  // Eşya toplama (yakınlık analizi)
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (dist(p, it) >= PICKUP_R || p.y > 30) continue;
    const def = ITEM_TYPES[it.type];
    if (def.weapon) {
      if (p.weapon === it.type && p.weaponDur >= WEAPONS[it.type].dur) continue;
      p.weapon = it.type; p.weaponDur = WEAPONS[it.type].dur;
    } else {
      const free = p.inventory.indexOf(null);
      if (free < 0) { if (p.fullWarn <= 0) { toast(p.id, '🎒 Envanter dolu!', 1.2); p.fullWarn = 1.5; } continue; }
      p.inventory[free] = it.type; if (!p.inventory[p.sel]) p.sel = free;
    }
    sfx.pick(); toast(p.id, `${def.icon} ${def.name} alındı`, 1.4);
    scene.remove(it.g); items.splice(i, 1); respawnQueue.push(14);
  }
}

function hurtPlayer(p, m) {
  const kx = p.x - m.x, kz = p.z - m.z, kl = Math.hypot(kx, kz) || 1;
  for (let s = 0; s < 8; s++) moveWithCollision(p, kx / kl * 11, kz / kl * 11);
  m.state = 'stunned'; m.t = 2; m.target = null;
  shake[p.id] = 12; huds[p.id].flashT = 0.6;
  if (p.shield) { p.shield = false; p.invuln = 1.5; toast(p.id, '🛡️ Kalkan seni korudu!'); sfx.whack(); return; }
  p.lives--; p.invuln = 2.5; p.adrenaline = 2.2; sfx.hurt();
  if (p.lives <= 0) {
    p.down = true; p.reviveT = 0; p.mesh.g.rotation.x = -Math.PI / 2;
    toast(p.id, '💀 Yere düştün! Partnerini bekle...', 3); toast(1 - p.id, `🆘 ${NAMES[p.id]} yere düştü! Git ve kaldır!`, 3);
    if (players.every(q => q.down)) endGame(false, 'İkiniz de yere düştünüz. Birbirinizi kollayın, yüksek yerlere çıkın, silahları kullanın!');
  } else toast(p.id, '💔 Canavar sana ulaştı! Yükseğe zıpla ya da kaç!', 2);
}

function updateMonster(m, dt) {
  m.ignore = Math.max(0, m.ignore - dt); m.lungeCd = Math.max(0, m.lungeCd - dt);
  if (m.state !== 'dying' && m.state !== 'emerge' && !unstick(m)) { m.state = 'dying'; m.t = 0.8; return; }
  const before = { x: m.x, z: m.z };
  const reachable = p => p && !p.onBus && !p.down && p.y < 28;
  switch (m.state) {
    case 'emerge': m.t -= dt; if (m.t <= 0) { m.state = 'chase'; m.chaseT = 0; } return;
    case 'dying': m.t -= dt; if (m.t <= 0) removeMonster(m); return;
    case 'stunned': m.t -= dt; m.facing += dt * 5; if (m.t <= 0) { m.state = 'patrol'; m.node = nearestNode(m); m.ignore = 1.5; } return;
    case 'windup': m.t -= dt; if (m.target) m.facing = Math.atan2(m.target.x - m.x, m.target.z - m.z); if (m.t <= 0) { m.state = 'lunge'; m.t = 0.3; m.lungeDir = m.facing; } break;
    case 'lunge': m.t -= dt; moveWithCollision(m, Math.sin(m.lungeDir) * LV.monster.lunge * dt, Math.cos(m.lungeDir) * LV.monster.lunge * dt); if (m.t <= 0) { m.state = 'recover'; m.t = 0.9; m.lungeCd = 1.6; } break;
    case 'recover': m.t -= dt; if (m.t <= 0) m.state = reachable(m.target) ? 'chase' : 'patrol'; break;
  }
  if (m.state === 'chase' || m.state === 'patrol') {
    if (m.state === 'patrol' && m.ignore <= 0) {
      let best = null, bd = DETECT_R;
      for (const p of players) if (reachable(p)) { const d = dist(m, p); if (d < bd) { bd = d; best = p; } }
      if (best) { m.state = 'chase'; m.target = best; m.chaseT = 0; LV.monster.sound(); }
    }
    if (m.state === 'chase') {
      m.chaseT += dt;
      const t = m.target, lost = !t || t.onBus || t.down || dist(m, t) > LOSE_R || m.chaseT > MAX_CHASE;
      const waiting = t && t.y >= 28; // yüksekteki oyuncuyu aşağıda bekler
      if (lost || (waiting && m.chaseT > 3.5)) { m.state = 'patrol'; m.target = null; m.node = nearestNode(m); m.ignore = 3; }
    }
    let tx, tz, speed;
    if (m.state === 'chase') {
      tx = m.target.x; tz = m.target.z; speed = LV.monster.chase; m.idle = 0;
      if (reachable(m.target) && dist(m, m.target) < LV.monster.range && m.lungeCd <= 0) { m.state = 'windup'; m.t = 0.42; }
    } else {
      m.idle += dt;
      const n = nodes[m.node];
      if (dist(m, n) < 12) { const opts = n.nb.filter(i => i !== m.prev); m.prev = m.node; const arr = opts.length ? opts : n.nb; m.node = arr[Math.floor(Math.random() * arr.length)]; }
      tx = nodes[m.node].x; tz = nodes[m.node].z; speed = LV.monster.patrol;
      if (m.idle > 40 && players.every(p => dist(p, m) > 500)) { m.state = 'dying'; m.t = 0.8; return; }
    }
    if (LV.monster.swim && inWater(m)) speed = m.state === 'chase' ? LV.monster.swim : speed * 1.6; // timsah suda hızlıdır
    if (m.state === 'chase' || m.state === 'patrol') {
      const ddx = tx - m.x, ddz = tz - m.z, l = Math.hypot(ddx, ddz) || 1;
      if (l > 4) moveWithCollision(m, ddx / l * speed * dt, ddz / l * speed * dt);
      m.facing = Math.atan2(ddx, ddz); m.phase += dt * speed * 0.07;
      if (dist(before, m) < speed * dt * 0.3 && l > 20) m.stuck += dt; else m.stuck = 0;
      if (m.stuck > 1.2) { m.stuck = 0; const n = nearestNode(m); m.state = 'patrol'; m.target = null; m.ignore = 2; m.node = nodes[n].nb[Math.floor(Math.random() * nodes[n].nb.length)] ?? n; }
    }
  }
  if (['chase', 'lunge', 'windup', 'patrol'].includes(m.state)) {
    for (const p of players) { if (!reachable(p) || p.invuln > 0 || dist(m, p) > HIT_R) continue; hurtPlayer(p, m); break; }
  }
}

function updateDirector(dt) {
  director.next -= dt;
  const alive = monsters.filter(m => m.state !== 'dying').length;
  if (director.next <= 0) { if (alive < maxMonsters() && spawnMonster()) director.next = 16 + Math.random() * 12; else director.next = 3; }
}

function updateMechanisms(dt, t) {
  // Plakalar
  for (const pl of plates) {
    pl.pressed = players.some(p => !p.down && !p.onBus && p.element === pl.who && p.onGround && Math.abs(p.y - pl.y) < 4 && dist(p, pl) < 30);
    pl.pad.position.y = pl.pressed ? 3 : 6;
    pl.pad.material.emissiveIntensity = pl.pressed ? 1.2 : 0.3;
  }
  LV.mechanisms(dt, t);
  // Kapı butonları (iki farklı konumda aynı anda: çoklu konum sorgusu)
  if (state === 'playing' && !tasksGate) {
    TASKS.btnFire.done = TASKS.btnFire.plate.pressed; TASKS.btnWater.done = TASKS.btnWater.plate.pressed;
    if (TASKS.btnFire.done && TASKS.btnWater.done) {
      if (LV.taskKeys.every(k => TASKS[k].done)) {
        tasksGate = true; barriers.forEach(b => (b.active = false)); bus.state = 'arriving'; bus.group.visible = true;
        taskDone(LV.gateText); director.next = 4;
      } else if (Math.floor(t * 2) % 6 === 0) toast('both', LV.notReadyText, 1.5);
    }
  }
}
// --- Genel mekanizmalar ---
function updBridge(B, dt) { // plaka basılıyken (ya da kilitliyse) uzayan köprü
  const want = B.locked || B.plate.pressed, prev = B.ext;
  B.ext = clamp(B.ext + (want ? 1 : -1) * dt * 1.6, 0, 1);
  if (B.ext !== prev && (B.ext === 1 || B.ext === 0)) sfx.click();
  B.s.active = B.ext > 0.97;
  const len = B.s.z1 - B.s.z0, m = B.s.mesh;
  m.scale.z = Math.max(0.001, B.ext);
  m.position.z = B.from === 'z1' ? B.s.z1 - len * B.ext / 2 : B.s.z0 + len * B.ext / 2;
  m.visible = B.ext > 0.01;
}
function updLift(L, dt) {
  const target = L.plate.pressed ? L.high : L.low;
  L.s.y1 += clamp(target - L.s.y1, -70 * dt, 70 * dt);
  L.mesh.scale.y = Math.max(1, L.s.y1); L.mesh.position.y = L.s.y1 / 2;
}
function updSlider(S, t) {
  const nx = S.cx0 + (S.cx1 - S.cx0) * (0.5 + 0.5 * Math.sin(t * 0.9));
  S.dx = S.x ? nx - S.x : 0; S.x = nx;
  Object.assign(S.s, { x0: S.ox + nx - S.w / 2, x1: S.ox + nx + S.w / 2, z0: S.oz + S.z0, z1: S.oz + S.z1 });
  S.s.mesh.position.set(S.ox + nx, 65, S.oz + (S.z0 + S.z1) / 2);
}
function updRisers(R, dt) { // plakaya basılınca lavdan yükselen taşlar
  const up = R.locked || R.plate.pressed;
  for (const st of R.list) {
    st.s.y1 += clamp((up ? st.high : 0) - st.s.y1, -60 * dt, 60 * dt);
    st.mesh.scale.y = Math.max(0.5, st.s.y1); st.mesh.position.y = st.s.y1 / 2 - 0.2;
  }
}
function coolPool(pl) { pl.active = false; pl.mat.color.setHex(pl.type === 'fire' ? 0x3a3a3a : 0x5a5040); pl.mat.emissive.setHex(0x000000); }
function mechanismsL1(dt, t) { updBridge(mech.bridge, dt); updLift(mech.lift, dt); updSlider(mech.slider, t); }

function updateVehicle(dt) {
  if (bus.kind === 'bus') {
    if (bus.state === 'arriving') { bus.x -= 520 * dt; if (bus.x <= CENTER.x) { bus.x = CENTER.x; bus.state = 'ready'; toast('both', '🚌 Otobüs hazır! İkiniz de binin'); } }
    else if (bus.state === 'leaving') { bus.speed = Math.min(650, bus.speed + 240 * dt); bus.x -= bus.speed * dt; if (bus.x < -300) endGame(true); }
    const spin = bus.state === 'arriving' ? 520 : bus.state === 'leaving' ? bus.speed : 0;
    bus.wheels.forEach(w => (w.rotation.y += spin * dt / 13));
  } else { // helikopter: dikey iniş / kalkış
    if (bus.state === 'arriving') { bus.y = Math.max(0, bus.y - 170 * dt); if (bus.y <= 0) { bus.state = 'ready'; toast('both', '🚁 Helikopter indi! İkiniz de binin'); } }
    else if (bus.state === 'leaving') { bus.speed = Math.min(320, bus.speed + 140 * dt); bus.y += bus.speed * dt; bus.x -= bus.speed * 0.4 * dt; if (bus.y > 950) endGame(true); }

function syncMeshes(dt, t) {
  for (const p of players) {
    const M = p.mesh;
    M.root.position.set(p.x, p.down ? p.y : 0, p.z);
    M.g.position.y = p.down ? 8 : p.y;
    M.ring.position.y = (p.down ? 0 : p.y) + 1.5;
    M.arrowPivot.position.y = p.y;

    if (!p.down) {

      if (air) { M.legL.rotation.x = -0.7; M.legR.rotation.x = 0.5; M.armL.rotation.x = M.armR.rotation.x = -2.4; }

      const s = Math.sin(m.phase * 1.2) * 0.7;

function fadeOccluders(cam, target) {
  const ty = target.y || 0, pts = [[target.x, ty + 50, target.z], [target.x, ty + 8, target.z]];
  const cp = cam.position;
  for (const f of fadeables) {
    const b = f.b; let occ = false;
    if (b.z1 > target.z - 60 && b.x0 < target.x + 260 && b.x1 > target.x - 260 && b.z0 < cp.z + 50) {
      for (const [px, py, pz] of pts) {
        for (let i = 1; i < 24 && !occ; i++) {
          const k = i / 24, x = cp.x + (px - cp.x) * k, y = cp.y + (py - cp.y) * k, z = cp.z + (pz - cp.z) * k;
          if (y < b.y1 && x > b.x0 - 12 && x < b.x1 + 12 && z > b.z0 - 12 && z < b.z1 + 12) occ = true;
        }
        if (occ) break;
      }
    }
    if (occ !== f.faded) {

      for (const mat of f.mats) { mat.transparent = occ; mat.opacity = occ ? 0.18 : 1; mat.depthWrite = !occ; mat.needsUpdate = true; }
    }
  }

  if (canopy) {
    for (const c of canopy.list) {
      let occ = false;
      if (c.z > target.z - 50 && Math.abs(c.x - target.x) < 240 && c.z < cp.z + 60) {
        for (const [px, py, pz] of pts) {
          for (let i = 1; i < 20 && !occ; i++) {
            const k = i / 20, x = cp.x + (px - cp.x) * k, y = cp.y + (py - cp.y) * k, z = cp.z + (pz - cp.z) * k;
            if (y < c.top && y > c.bottom - 20 && (x - c.x) ** 2 + (z - c.z) ** 2 < (c.r + 14) ** 2) occ = true;
          }
          if (occ) break;
        }
      }
      if (occ !== c.hidden) { c.hidden = occ; canopy.mesh.setMatrixAt(c.i, occ ? canopy.zero : c.m); canopy.dirty = true; }
    }
    if (canopy.dirty) { canopy.mesh.instanceMatrix.needsUpdate = true; canopy.dirty = false; }
  }
}

  if (state === 'playing' || state === 'ending') {
    players.forEach(p => updatePlayer(p, dt));
    if (state === 'playing') {
      playTime += dt;
      updateDirector(dt);
      [...monsters].forEach(m => updateMonster(m, dt));
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endGame(false, LV.timeoutText); }
    }
  }
  if (state === 'playing' || state === 'ending' || state === 'over') updateWorld(dt, elapsed);
  else if (state === 'menu' || state === 'tutorial') { players.forEach(p => (p.facing += dt * 0.6)); }
  syncMeshes(dt, elapsed);
  updateCameras(dt);
  for (const h of huds) if (h.toastT > 0 && (h.toastT -= dt) <= 0) h.toast.classList.remove('show');
  updateHUD(dt);
  render();
  pressed.clear();
  requestAnimationFrame(loop);
}

  }
  if (!TASKS.pyre.done) {
    if (fire) return { text: '<b>🌋 Lav Çukuru:</b> Lav gölüne gir. Su plakaya basınca taşlar yükselir; taşlardan adaya tırman ve 🔥 işaret ateşini yak (<b>E</b>).', target: TASKS.pyre };
    return { text: '<b>🌋 Lav Çukuru:</b> Girişteki 🟦 plakaya bas ve Ateş adaya çıkana kadar bekle. Lava basma!', target: mech.stonePlate };
  }
  if (!tasksGate) {
    const t = fire ? TASKS.btnFire : TASKS.btnWater;
    if (t.plate.pressed) return { text: '<b>Butondasın!</b> Partnerin de kendi kulesindeki butona basınca helikopter inecek. Bekle!' };
    return fire ? { text: '<b>🗼 Gölet Kulesi:</b> Suya düşmeden nilüfer yapraklarından zıpla, kuleye tırman ve tepedeki 🔥 butona bas. Partnerinle aynı anda!', target: t }
      : { text: '<b>🗼 Çalı Kulesi:</b> Yanan çalılara basmadan kütüklerden zıpla, kuleye tırman ve tepedeki 💧 butona bas. Partnerinle aynı anda!', target: t };
  }
  if (bus.state === 'arriving') return { text: '🚁 Helikopter iniyor... Helipada koş!', target: CENTER };
  return { text: `<b>🚁 Helipad:</b> Helikoptere git ve <b>${K}</b> ile bin!`, target: CENTER };
}
function checklistL2() {
  return [chk(TASKS.turbine.done, '⚙️ Türbin'), chk(mech.draw.locked, '🌉 Nehir'), chk(TASKS.pyre.done, '🔥 İşaret'), chk(tasksGate, '🗼 Kuleler'), chk(state === 'ending', '🚁 Kaçış')].join(' &nbsp;');
}
function onTaskL2(key) {
  if (key === 'turbine') {
    coolPool(mech.field); mech.fieldBridge.locked = true; (mech.fieldFx || []).forEach(f => (f.visible = false));
    addPuff((mech.field.x0 + mech.field.x1) / 2, 0, (mech.field.z0 + mech.field.z1) / 2, 0x9fd8ff, 3, 220, 16);
    taskDone('⚙️ Türbin döndü, şelale çalılık yangınını söndürdü! Sıradaki: 🌉 Nehir');
  } else {
    mech.stones.locked = true;
    taskDone(TASKS.turbine.done ? '🔥 İşaret ateşi yandı! Şimdi iki 🗼 kuleye çıkın, butonlara aynı anda basın' : '🔥 İşaret ateşi yandı! ⚙️ Türbini de unutmayın');
  }
}
function mechanismsL2(dt, t) {
  updBridge(mech.fieldBridge, dt); updBridge(mech.draw, dt); updRisers(mech.stones, dt);
  if (state === 'playing' && !mech.draw.locked && mech.draw.s.active) {
    const f = players[0];
    if (f.z < 1235 && f.x > 1250 && f.x < 1650) { mech.draw.locked = true; taskDone('🌉 Ateş karşıya geçti! Köprü artık sabit.'); }
  }
  if (mech.fireflies) mech.fireflies.position.y = Math.sin(t * 0.8) * 5;
  if (mech.fall) mech.fall.material.opacity = 0.42 + Math.sin(t * 5) * 0.08;
}

/* =====================================================================
   LEVEL AKIŞI
   ===================================================================== */
let curLevel = 1;
const introSeen = {};
function clearLevel() {
  levelRoot.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  levelRoot.clear();
  for (const a of [solids, dynSolids, fadeables, pools, plates, gems, districtInfo, buildings, parks, fullBarricades, barriers]) a.length = 0;
  grid.clear();
  for (const k in TASKS) delete TASKS[k];
  for (const k in mech) delete mech[k];
  canopy = null;
}
function buildLevel(n) {
  clearLevel();
  curLevel = n; LV = LEVELS[n - 1];
  srand = mulberry32(n === 1 ? 458 : 900 + n);
  LV.build();
  buildGrid(); buildGraph(); drawMinimapBase();
  gemTotals = [gems.filter(g => g.who === 'fire').length, gems.filter(g => g.who === 'water').length];
}
// Level'ı sıfırdan kurar; ilk girişte o level'ın tanıtım sayfalarını gösterir
function startLevel(n, skipIntro = false) {
  ac()?.resume?.(); startAmbient();
  buildLevel(n); resetGame();
  const pages = n === 1 ? (tutSeen ? null : PAGES) : (introSeen[n] ? null : LV.intro);
  if (pages && !skipIntro) { introSeen[n] = true; openTut('start', pages); } else begin();
}
function begin() {
  showScreen(null);
  state = 'playing';
  toast(0, LV.startText[0], 3.2); toast(1, LV.startText[1], 3.2);
}
function start() { startLevel(curLevel, true); }
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); layoutHUD(); });

buildLevel(1); resetGame();
showScreen('menuScreen');
requestAnimationFrame(loop);
